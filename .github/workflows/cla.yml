name: "CLA Assistant"

# Bắt buộc contributor ký CLA (CLA.md) ở Pull Request đầu tiên.
# Yêu cầu: tạo 1 secret tên CLA_PAT (Personal Access Token, scope `repo`) trong
# repo Settings → Secrets and variables → Actions. Token này để bot ghi chữ ký
# vào file signatures/cla.json.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/vunaaid/msmeai/blob/main/CLA.md'
          branch: 'main'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Cảm ơn PR của bạn! Vui lòng đọc [CLA](CLA.md) và comment đúng câu dưới đây để ký (một lần duy nhất).'
          allowlist: 'vunaaid,dependabot[bot]'
