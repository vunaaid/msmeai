version: "3.9"

# vSME — Dev Infrastructure
# PostgreSQL 16 + Redis 7 + MinIO
#
# ⚠️  CHỈ DÙNG CHO DEV LOCAL. Các mật khẩu/secret dưới đây là GIÁ TRỊ MẶC ĐỊNH
#     công khai (vsme_dev_secret, vsme_minio_secret, vsme_onlyoffice_jwt_secret...).
#     TUYỆT ĐỐI đổi toàn bộ trước khi chạy ở môi trường thật / public.
# ⚠️  FOR LOCAL DEV ONLY. The passwords/secrets below are public defaults —
#     change ALL of them before any production or internet-facing deployment.

services:
  # ─── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vsme_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vsme
      POSTGRES_PASSWORD: vsme_dev_secret
      POSTGRES_DB: vsme_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsme -d vsme_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vsme_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass vsme_redis_secret
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "vsme_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible File Storage) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: vsme_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vsme_minio_admin
      MINIO_ROOT_PASSWORD: vsme_minio_secret
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── MinIO Setup (tạo bucket mặc định) ──────────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: vsme_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 vsme_minio_admin vsme_minio_secret;
        mc mb --ignore-existing myminio/vsme-files;
        mc mb --ignore-existing myminio/vsme-exports;
        mc mb --ignore-existing myminio/vsme-temp;
        mc anonymous set download myminio/vsme-temp;
        echo 'MinIO setup complete';
        exit 0;
      "

  # ─── OnlyOffice Document Server (xem/sửa Word/Excel/PPTX WYSIWYG) ────────────
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: vsme_onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: vsme_onlyoffice_jwt_secret   # phải khớp ONLYOFFICE_JWT_SECRET trong .env
      JWT_HEADER: Authorization
    ports:
      - "8082:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
    # Cho phép container gọi API + tải file từ MinIO chạy trên host (dev).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── MailHog (Dev email catcher) ────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: vsme_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:
  onlyoffice_data:
  onlyoffice_log:

networks:
  default:
    name: vsme_network
